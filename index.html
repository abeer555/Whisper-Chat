      // ═══════════════════════════════════════════════════════════
      //  WEBSOCKET  (BUG-FIXED)
      // ═══════════════════════════════════════════════════════════
      const WS_PROTOCOL =
        window.location.protocol === "https:" ? "wss:" : "ws:";
      const WS_SERVER = `${WS_PROTOCOL}//${window.location.host}`;

      function connectWebSocket() {
        return new Promise((resolve, reject) => {
          const params = new URLSearchParams({
            channel: currentChannel,
            password: currentPassword,
            username: currentUser,
          });

          // Always close any lingering socket before creating a new one
          // to prevent ghost connections that produce duplicate messages.
          if (ws) {
            ws.onclose = null; // detach handler so it can't trigger another reconnect
            ws.onerror = null;
            try {
              ws.close();
            } catch (_) {}
            ws = null;
          }

          const socket = new WebSocket(`${WS_SERVER}/?${params}`);
          ws = socket;

          socket.onopen = () => {
            reconnectDelay = 2000; // reset back-off on successful connection
            // App-level keep-alive ("wake beacon"): the server's 30 s TCP ping
            // requests a pong, but if the client never *sends* anything the NAT /
            // mobile radios may still drop an idle-looking connection, and a dead
            // half-open socket can linger undetected for minutes on mobile.
            // Sending a lightweight ping every 25 s keeps the path alive and
            // surfaces a real failure within one interval instead of at TCP timeout.
            clearInterval(pingTimer);
            clearTimeout(pongTimeout);
            pingTimer = setInterval(() => {
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "ping" }));
                // Any traffic back within 15 s counts as life. If the socket
                // silently died (mobile sleep, NAT drop), nothing comes back —
                // close it ourselves so the normal reconnect path kicks in,
                // instead of waiting minutes for a TCP timeout to notice.
                clearTimeout(pongTimeout);
                pongTimeout = setTimeout(() => {
                  if (isChatActive && ws) { try { ws.close(); } catch (_) {} }
                }, 15_000);
              }
            }, 25_000);
            resolve();
          };

          socket.onmessage = (event) => {
            if (socket !== ws) return; // stale socket — discard
            // Any inbound traffic proves the link is alive — cancel the
            // "close if silent" deadline our ping set.
            clearTimeout(pongTimeout);
            pongTimeout = null;
            try {
              const data = JSON.parse(event.data);
              switch (data.type) {
                case "room_state":
                  data.users.forEach((u) => addPresenceUser(u, true));
                  break;
                case "user_joined":
                  handleUserJoined(data.username);
                  break;
                case "user_left":
                  handleUserLeft(data.username);
                  // Remove from typing set if they disconnect mid-type
                  typingUsers.delete(data.username);
                  renderTypingIndicator();
                  break;
                case "chat":
                  handleReceiveMessage(data.username, data.text, data.replyTo || null, data.msgId || null);
                  break;
                // Server accepted our message → show single ✓
                case "msg_ack": {
                  const el = pendingTicks.get(data.msgId);
                  if (el && !el.classList.contains("delivered")) el.textContent = "✓";
                  break;
                }
                // A recipient rendered it → flip to double ✓✓
                case "msg_delivered": {
                  const el = pendingTicks.get(data.msgId);
                  if (el) {
                    el.textContent = "✓✓";
                    el.classList.add("delivered");
                    pendingTicks.delete(data.msgId); // terminal state — free the entry
                  }
                  break;
                }
                // ── Typing indicators ──
                case "typing_start":
                  typingUsers.add(data.username);
                  renderTypingIndicator();
                  break;
                case "typing_stop":
                  typingUsers.delete(data.username);
                  renderTypingIndicator();
                  break;
                // ── File / photo ──
                case "file":
                  handleReceiveFile(data.username, {
                    filename: data.filename,
                    mimeType: data.mimeType,
                    size:     data.size,
                    dataURL:  data.dataURL,
                  });
                  break;
                // ── WebRTC signaling ──
                case "webrtc_offer":
                  handleWebRTCOffer(data.from, data.payload);
                  break;
                case "webrtc_answer":
                  handleWebRTCAnswer(data.payload);
                  break;
                case "webrtc_ice":
                  handleWebRTCIce(data.payload);
                  break;
                // ── Call signaling ──
                case "call_request":
                  showIncomingCall(data.from);
                  break;
                case "call_accepted":
                  onCallAccepted(data.from);
                  break;
                case "call_declined":
                  onCallDeclined(data.from);
                  break;
                case "call_ended":
                  endCall(true);
                  break;
              }
            } catch (_) {}
          };

          // BUG-FIX: only one reconnect loop at a time (isReconnecting guard)
          socket.onclose = () => {
            if (socket !== ws) return; // already replaced
            clearTimeout(pongTimeout);
            pongTimeout = null;
            if (!isChatActive) return; // intentional disconnect
            scheduleReconnect();
          };

          socket.onerror = () => {
            if (socket === ws) reject(new Error("WebSocket connection failed"));
          };
        });
      }

      // ── Reconnect helpers ───────────────────────────────────────────
      // scheduleReconnect backs off and retries in a loop; attemptReconnectNow
      // wakes it instantly (tab foreground / network back).
      function scheduleReconnect() {
        if (!isChatActive) return;
        if (isReconnecting) return; // already retrying
        isReconnecting = true;
        renderSystemMessage(
          `Connection lost. Reconnecting in ${reconnectDelay / 1000}s…`,
        );
        reconnectTimer = setTimeout(runReconnectAttempt, reconnectDelay);
      }

      function runReconnectAttempt() {
        if (!isChatActive) {
          isReconnecting = false;
          return;
        }
        connectWebSocket()
          .then(() => {
            isReconnecting = false;
            renderSystemMessage("Reconnected ✓");
          })
          .catch(() => {
            // exponential back-off, cap at 30 s; keep looping until back
            reconnectDelay = Math.min(reconnectDelay * 2, 30_000);
            if (isChatActive) {
              reconnectTimer = setTimeout(runReconnectAttempt, reconnectDelay);
            } else {
              isReconnecting = false;
            }
          });
      }

      function attemptReconnectNow() {
        if (!isChatActive) return;
        // Still connected (or mid-handshake) — nothing to do
        if (ws && ws.readyState === WebSocket.OPEN) return;
        if (ws && ws.readyState === WebSocket.CONNECTING) return;

        if (isReconnecting) {
          // A retry is pending — bring it forward instead of waiting out the back-off
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(runReconnectAttempt, 250);
        } else {
          scheduleReconnect();
        }
      }

      // Wake-up probes: when the tab or network comes back to life, don't sit
      // waiting for TCP/heartbeat to notice — check the socket right away.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) attemptReconnectNow();
      });
      window.addEventListener("pageshow", attemptReconnectNow);
      window.addEventListener("online", attemptReconnectNow);

      // ── Send helper ───────────────────────────────────────────────
      function wsSend(data) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify(data));
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  WebRTC VOICE CALLS
      // ═══════════════════════════════════════════════════════════
      const STUN_SERVERS = {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun.cloudflare.com:3478" },
        ],
      };

      const callState = {
        active: false,
        peer: null,
        pc: null,
        stream: null,
        timerID: null,
        connectTimeoutID: null,
        seconds: 0,
        muted: false,
        isInitiator: false,
        // ICE candidates that arrive before setRemoteDescription is called
        // must be buffered — applying them before remote desc throws an error
        // that browsers silently swallow, causing the connection to never form.
        pendingIce: [],
        remoteDescSet: false,
      };

      const callOverlay = document.getElementById("call-overlay");
      const callAvatar = document.getElementById("call-avatar");
      const callCardLabel = document.getElementById("call-card-label");
      const callCardName = document.getElementById("call-card-name");
      const callCardActions = document.getElementById("call-card-actions");
      const activeCallBar = document.getElementById("active-call-bar");
      const callPeerName = document.getElementById("call-peer-name");
      const callTimerEl = document.getElementById("call-timer");
      const btnMute = document.getElementById("btn-mute");
      const remoteAudio = document.getElementById("remote-audio");

      function getCallablePeer() {
        const others = [...onlineUsers.entries()].filter(
          ([u, v]) => u !== currentUser && v.online,
        );
        return others.length === 1 ? others[0][0] : null;
      }

      function refreshCallButton() {
        const btnCall = document.getElementById("btn-call");
        if (!btnCall) return;
        const peer = getCallablePeer();
        if (callState.active) {
          btnCall.classList.remove("call-btn-disabled");
          btnCall.classList.add("call-btn-active");
          btnCall.title = "In call";
        } else if (peer) {
          btnCall.classList.remove("call-btn-disabled", "call-btn-active");
          btnCall.title = `Call @${peer}`;
        } else {
          btnCall.classList.add("call-btn-disabled");
          btnCall.classList.remove("call-btn-active");
          btnCall.title = "Need exactly 1 other online user to call";
        }
      }

      // ── Overlay helpers ──────────────────────────────────────────
      function showCallOverlay(label, name, actions) {
        callCardLabel.textContent = label;
        callCardName.textContent = name ? "@" + name : "";
        callCardActions.innerHTML = "";
        actions.forEach(({ text, cls, fn }) => {
          const b = document.createElement("button");
          b.className = cls;
          b.textContent = text;
          b.onclick = fn;
          callCardActions.appendChild(b);
        });
        callOverlay.classList.add("visible");
      }
      function setOverlayStatus(label) {
        callCardLabel.textContent = label;
      }
      function hideCallOverlay() {
        callOverlay.classList.remove("visible");
      }

      // ── Initiator flow ───────────────────────────────────────────
      async function initiateCall() {
        if (callState.active || callState.peer) return;

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          renderSystemMessage(
            "⚠️ Your browser doesn't support voice calls (requires HTTPS or localhost).",
          );
          return;
        }
        const peer = getCallablePeer();
        if (!peer) {
          renderSystemMessage(
            "⚠️ Need exactly 1 other online user to start a call.",
          );
          return;
        }

        callState.peer = peer;
        callState.isInitiator = true;

        // Show overlay immediately — keep it visible through entire setup
        showCallOverlay("Requesting microphone…", peer, [
          { text: "📵", cls: "btn-call-decline", fn: cancelOutgoingCall },
        ]);

        // Get mic before we notify the other side so we're fully ready
        try {
          callState.stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });
        } catch (err) {
          renderSystemMessage(`⚠️ Microphone error: ${err.message}`);
          callState.peer = null;
          callState.isInitiator = false;
          hideCallOverlay();
          return;
        }

        // Guard: user may have cancelled during the getUserMedia dialog
        if (!callState.peer) {
          stopStream();
          return;
        }

        setOverlayStatus("Calling…");
        wsSend({ type: "call_request", target: peer });
        renderSystemMessage(`📞 Calling @${peer}…`);
      }

      function cancelOutgoingCall() {
        const peer = callState.peer;
        callState.peer = null;
        callState.isInitiator = false;
        stopStream();
        hideCallOverlay();
        if (peer) {
          wsSend({ type: "call_ended", target: peer });
          renderSystemMessage("📵 Call cancelled.");
        }
      }

      // ── Callee flow ──────────────────────────────────────────────
      function showIncomingCall(from) {
        // Don't show if we're already in a call
        if (callState.active || (callState.peer && callState.peer !== from)) {
          wsSend({ type: "call_declined", target: from });
          return;
        }
        callState.peer = from;
        showCallOverlay("Incoming Call", from, [
          { text: "📞", cls: "btn-call-accept", fn: () => acceptCall(from) },
          { text: "📵", cls: "btn-call-decline", fn: () => declineCall(from) },
        ]);
        renderSystemMessage(`📞 Incoming call from @${from}`);
      }

      async function acceptCall(from) {
        if (!callState.peer) return; // already cancelled or timed out
        setOverlayStatus("Requesting microphone…");
        // Disable buttons so they can't be double-clicked
        callCardActions
          .querySelectorAll("button")
          .forEach((b) => (b.disabled = true));

        try {
          callState.stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: false,
          });
        } catch (err) {
          renderSystemMessage(`⚠️ Microphone error: ${err.message}`);
          wsSend({ type: "call_declined", target: from });
          callState.peer = null;
          hideCallOverlay();
          return;
        }

        if (!callState.peer) {
          stopStream();
          hideCallOverlay();
          return;
        }

        setOverlayStatus("Connecting…");
        // Create PC BEFORE sending call_accepted so it's ready when offer arrives
        setupPeerConnection(false);
        wsSend({ type: "call_accepted", target: from });
      }

      function declineCall(from) {
        wsSend({ type: "call_declined", target: from });
        callState.peer = null;
        hideCallOverlay();
        renderSystemMessage(`You declined the call from @${from}.`);
      }

      // ── Initiator receives "accepted" ────────────────────────────
      function onCallAccepted(from) {
        // Don't hide overlay — update the status label in-place
        setOverlayStatus("Connecting…");
        // Mic was already acquired in initiateCall; just set up the PC
        callState.peer = from;
        setupPeerConnection(true); // caller creates & sends offer
      }

      function onCallDeclined(from) {
        stopStream();
        hideCallOverlay();
        callState.peer = null;
        callState.isInitiator = false;
        renderSystemMessage(`@${from} declined the call.`);
      }

      function stopStream() {
        if (callState.stream) {
          callState.stream.getTracks().forEach((t) => t.stop());
          callState.stream = null;
        }
      }

      // ── ICE candidate buffering ──────────────────────────────────
      // Preserve any candidates that arrived before the PC was created
      // (can happen if the remote's ICE gathers faster than our async setup).
      function bufferOrAddIce(candidate) {
        if (!callState.pc) {
          callState.pendingIce.push(candidate);
          return;
        }
        if (callState.remoteDescSet) {
          callState.pc
            .addIceCandidate(new RTCIceCandidate(candidate))
            .catch(() => {});
        } else {
          callState.pendingIce.push(candidate);
        }
      }

      async function drainPendingIce() {
        callState.remoteDescSet = true;
        const queue = callState.pendingIce.splice(0); // drain without resetting the array ref
        for (const c of queue) {
          try {
            await callState.pc.addIceCandidate(new RTCIceCandidate(c));
          } catch (_) {}
        }
      }

      // ── Core peer connection ─────────────────────────────────────
      function setupPeerConnection(createOffer) {
        const pc = new RTCPeerConnection(STUN_SERVERS);
        // NOTE: do NOT reset pendingIce here — candidates may have arrived
        // while getUserMedia was running (e.g. from the remote peer's faster setup)
        callState.pc = pc;
        callState.remoteDescSet = false;

        if (callState.stream) {
          callState.stream
            .getTracks()
            .forEach((t) => pc.addTrack(t, callState.stream));
        }

        pc.ontrack = (e) => {
          remoteAudio.srcObject = e.streams[0];
        };

        pc.onicecandidate = (e) => {
          // null candidate = gathering complete; don't send
          if (e.candidate && callState.peer) {
            wsSend({
              type: "webrtc_ice",
              target: callState.peer,
              payload: e.candidate,
            });
          }
        };

        // Use iceConnectionState — most reliable across browsers
        pc.oniceconnectionstatechange = () => {
          const s = pc.iceConnectionState;
          console.log("[call] iceConnectionState →", s);
          if ((s === "connected" || s === "completed") && !callState.active) {
            clearTimeout(callState.connectTimeoutID);
            startActiveCall();
          } else if (s === "failed") {
            renderSystemMessage("⚠️ Call failed (ICE). Try again.");
            endCall(true);
          }
        };

        pc.onconnectionstatechange = () => {
          const s = pc.connectionState;
          console.log("[call] connectionState →", s);
          if (s === "connected" && !callState.active) {
            clearTimeout(callState.connectTimeoutID);
            startActiveCall();
          } else if (s === "failed") {
            endCall(true);
          }
        };

        // 25-second connection timeout
        callState.connectTimeoutID = setTimeout(() => {
          if (!callState.active && callState.pc === pc) {
            renderSystemMessage(
              "⚠️ Call timed out. Could not reach the other side.",
            );
            endCall(true);
          }
        }, 25000);

        if (createOffer) {
          pc.createOffer({ offerToReceiveAudio: true })
            .then((offer) => pc.setLocalDescription(offer))
            .then(() => {
              if (!callState.peer) {
                endCall(true);
                return;
              }
              wsSend({
                type: "webrtc_offer",
                target: callState.peer,
                payload: pc.localDescription,
              });
            })
            .catch((err) => {
              renderSystemMessage(`⚠️ Could not create offer: ${err.message}`);
              endCall(true);
            });
        }
      }

      async function handleWebRTCOffer(from, offer) {
        if (!callState.pc) {
          console.warn("[call] Offer arrived but no PC exists");
          return;
        }
        try {
          await callState.pc.setRemoteDescription(
            new RTCSessionDescription(offer),
          );
          await drainPendingIce();
          const answer = await callState.pc.createAnswer();
          await callState.pc.setLocalDescription(answer);
          wsSend({
            type: "webrtc_answer",
            target: from,
            payload: callState.pc.localDescription,
          });
        } catch (err) {
          renderSystemMessage(`⚠️ WebRTC handshake error: ${err.message}`);
          endCall(true);
        }
      }

      async function handleWebRTCAnswer(answer) {
        if (!callState.pc) return;
        try {
          await callState.pc.setRemoteDescription(
            new RTCSessionDescription(answer),
          );
          await drainPendingIce();
        } catch (err) {
          renderSystemMessage(`⚠️ Could not apply answer: ${err.message}`);
          endCall(true);
        }
      }

      function handleWebRTCIce(candidate) {
        bufferOrAddIce(candidate);
      }

      // ── Active call ──────────────────────────────────────────────
      function startActiveCall() {
        if (callState.active) return; // guard duplicate fires
        callState.active = true;
        callState.seconds = 0;
        callPeerName.textContent = callState.peer;
        activeCallBar.classList.add("visible");
        hideCallOverlay();
        refreshCallButton();
        callState.timerID = setInterval(() => {
          callState.seconds++;
          const m = String(Math.floor(callState.seconds / 60)).padStart(2, "0");
          const s = String(callState.seconds % 60).padStart(2, "0");
          callTimerEl.textContent = `${m}:${s}`;
        }, 1000);
        renderSystemMessage(`📞 Call connected with @${callState.peer}.`);
      }

      function endCall(remote = false) {
        if (!remote && callState.peer) {
          wsSend({ type: "call_ended", target: callState.peer });
        }
        clearInterval(callState.timerID);
        clearTimeout(callState.connectTimeoutID);
        callState.connectTimeoutID = null;
        if (callState.pc) {
          try {
            callState.pc.close();
          } catch (_) {}
          callState.pc = null;
        }
        stopStream();
        remoteAudio.srcObject = null;
        activeCallBar.classList.remove("visible");
        hideCallOverlay();
        const peer = callState.peer;
        callState.active = false;
        callState.muted = false;
        callState.isInitiator = false;
        callState.peer = null;
        callState.seconds = 0;
        callState.pendingIce = [];
        callState.remoteDescSet = false;
        refreshCallButton();
        if (peer) renderSystemMessage(`📵 Call ended.`);
      }

      btnMute.addEventListener("click", () => {
        if (!callState.stream) return;
        callState.muted = !callState.muted;
        callState.stream.getAudioTracks().forEach((t) => {
          t.enabled = !callState.muted;
        });
        btnMute.textContent = callState.muted ? "🔇 Unmute" : "🎤 Mute";
      });

      // ═══════════════════════════════════════════════════════════
      //  FILE & PHOTO SENDING
      // ═══════════════════════════════════════════════════════════

      // ═══════════════════════════════════════════════════════════
      //  BACKGROUND PICKER
      // ═══════════════════════════════════════════════════════════
      const BG_PRESETS = [
        { label: "Default",    value: "" },
        { label: "Sage",       value: "linear-gradient(135deg,#e8f5e9 0%,#f1f8e9 100%)" },
        { label: "Peach",      value: "linear-gradient(135deg,#fff3e0 0%,#fce4ec 100%)" },
        { label: "Ocean",      value: "linear-gradient(135deg,#e3f2fd 0%,#e8eaf6 100%)" },
        { label: "Rose",       value: "linear-gradient(135deg,#fce4ec 0%,#f8bbd9 100%)" },
        { label: "Lavender",   value: "linear-gradient(135deg,#ede7f6 0%,#e8eaf6 100%)" },
        { label: "Mint",       value: "linear-gradient(135deg,#e0f2f1 0%,#b2dfdb 100%)" },
        { label: "Sunset",     value: "linear-gradient(135deg,#ff9a9e 0%,#fecfef 50%,#fecfef 100%)" },
        { label: "Nordic",     value: "linear-gradient(135deg,#2d3561 0%,#a16bfe 100%)" },
        { label: "Midnight",   value: "linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%)" },
        { label: "Forest",     value: "linear-gradient(135deg,#134e5e 0%,#71b280 100%)" },
        { label: "Pure White", value: "#ffffff" },
      ];

      const bgPickerPanel  = document.getElementById("bg-picker-panel");
      const bgPickerBtn    = document.getElementById("btn-bg-picker");
      const bgSwatchGrid   = document.getElementById("bg-swatch-grid");
      const bgCustomInput  = document.getElementById("bg-custom-input");
      const chatMessagesEl = document.getElementById("chat-messages");

      let activeBgValue = localStorage.getItem("matcha-bg") || "";

      function applyBackground(value, fromSwatch = false) {
        activeBgValue = value;
        if (value === "") {
          chatMessagesEl.style.removeProperty("background");
          chatMessagesEl.style.removeProperty("background-color");
        } else if (value.startsWith("#")) {
          chatMessagesEl.style.background = value;
        } else {
          chatMessagesEl.style.background = value;
        }
        localStorage.setItem("matcha-bg", value);
        // Update swatch active states
        bgSwatchGrid.querySelectorAll(".bg-swatch").forEach((el) => {
          el.classList.toggle("active", el.dataset.value === value);
        });
        if (!fromSwatch && !value.startsWith("linear")) {
          bgCustomInput.value = value || "#f1f5f2";
        }
      }

      // Build swatch grid
      BG_PRESETS.forEach(({ label, value }) => {
        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "bg-swatch" + (activeBgValue === value ? " active" : "");
        swatch.title = label;
        swatch.dataset.value = value;
        const bg = value || "linear-gradient(135deg,#f1f5f2 0%,#e8f0ea 100%)";
        swatch.style.background = bg;
        swatch.innerHTML = `<span class="bg-swatch-check">✓</span>`;
        swatch.addEventListener("click", () => {
          applyBackground(value, true);
        });
        bgSwatchGrid.appendChild(swatch);
      });

      // Custom colour input
      bgCustomInput.addEventListener("input", function () {
        applyBackground(this.value);
      });

      // Toggle picker panel open/close
      bgPickerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        bgPickerPanel.classList.toggle("open");
      });
      document.addEventListener("click", (e) => {
        if (!bgPickerPanel.contains(e.target) && e.target !== bgPickerBtn) {
          bgPickerPanel.classList.remove("open");
        }
      });

      // Restore persisted BG on load
      if (activeBgValue) applyBackground(activeBgValue);

      // ═══════════════════════════════════════════════════════════
      //  TYPING INDICATORS
      // ═══════════════════════════════════════════════════════════
      const typingIndicatorRow = document.getElementById("typing-indicator-row");
      const typingUsers = new Set(); // users currently typing
      let typingStopTimer = null;

      function renderTypingIndicator() {
        typingIndicatorRow.innerHTML = "";
        if (typingUsers.size === 0) return;

        const names = [...typingUsers];
        let label;
        if (names.length === 1)      label = `${names[0]} is typing`;
        else if (names.length === 2) label = `${names[0]} and ${names[1]} are typing`;
        else                         label = `${names.slice(0,-1).join(", ")} and ${names.at(-1)} are typing`;

        const bubble = document.createElement("div");
        bubble.className = "typing-bubble";
        bubble.innerHTML = `
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span class="typing-text">${escapeHTML(label)}…</span>`;
        typingIndicatorRow.appendChild(bubble);
        // Keep indicator pinned at bottom without scroll-jacking messages
        typingIndicatorRow.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      // Send typing events when the local user types
      let typingSent = false;
      messageInput.addEventListener("input", function () {
        if (!isChatActive) return;
        if (!typingSent && this.value.trim().length > 0) {
          typingSent = true;
          wsSend({ type: "typing_start" });
        }
        clearTimeout(typingStopTimer);
        typingStopTimer = setTimeout(() => {
          typingSent = false;
          wsSend({ type: "typing_stop" });
        }, 1500);
      });

      // Clear typing state on send
      function clearTypingOnSend() {
        clearTimeout(typingStopTimer);
        if (typingSent) {
          wsSend({ type: "typing_stop" });
          typingSent = false;
        }
      }

      // ═══════════════════════════════════════════════════════════
      //  BROWSER NOTIFICATIONS
      // ═══════════════════════════════════════════════════════════
      let notifPermission = Notification.permission;

      function requestNotifPermission() {
        if (Notification.permission === "default") {
          Notification.requestPermission().then((p) => {
            notifPermission = p;
          });
        } else {
          notifPermission = Notification.permission;
        }
      }

      function showNotification(sender, text) {
        if (notifPermission !== "granted") return;
        if (!document.hidden) return; // tab is focused — don't notify
        const n = new Notification(`${sender} in #${currentChannel}`, {
          body: text.length > 80 ? text.slice(0, 80) + "…" : text,
          icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f3a683' d='M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z'/%3E%3C/svg%3E",
          tag: "matcha-chat-msg",
          silent: false,
        });
        n.onclick = () => {
          window.focus();
          n.close();
        };
      }

      // ── File & Photo Sending ──────────────────────────────────────
      const fileInput       = document.getElementById("file-input");

      const btnAttach       = document.getElementById("btn-attach");
      const filePreviewBar  = document.getElementById("file-preview-bar");
      const lightbox        = document.getElementById("lightbox");
      const lightboxImg     = document.getElementById("lightbox-img");
      const lightboxClose   = document.getElementById("lightbox-close");

      // Staged file waiting to be sent.
      // For images we re-encode through <canvas> to a universal JPEG (see below),
      // so `overrides` carries the post-encode filename / mimeType / size. For
      // non-images `overrides` stays null and we read straight off the File.
      const stagedFile = { file: null, dataURL: null, overrides: null };

      /** Format bytes → human-readable string */
      function formatBytes(bytes) {
        if (bytes < 1024)       return bytes + " B";
        if (bytes < 1024*1024)  return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024*1024)).toFixed(1) + " MB";
      }

      /** Pick a representative emoji icon for a given MIME type */
      function fileIcon(mimeType) {
        if (mimeType.startsWith("image/"))        return "🖼️";
        if (mimeType === "application/pdf")       return "📄";
        if (mimeType.startsWith("video/"))        return "🎬";
        if (mimeType.startsWith("audio/"))        return "🎵";
        if (mimeType.includes("zip") || mimeType.includes("compressed")) return "📦";
        if (mimeType.startsWith("text/"))         return "📝";
        if (mimeType.includes("word") || mimeType.includes("document")) return "📃";
        if (mimeType.includes("sheet") || mimeType.includes("excel"))   return "📊";
        return "📎";
      }

      // ── Attach button → open picker ───────────────────────────
      btnAttach.addEventListener("click", () => {
        fileInput.value = ""; // reset so same file can be re-selected
        fileInput.click();
      });

      // ── File selected ─────────────────────────────────────────
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (!file) return;

        // 10 MB guard (checked on the original file; re-encoding will shrink)
        if (file.size > 10 * 1024 * 1024) {
          renderSystemMessage("⚠️ File too large (max 10 MB).");
          return;
        }

        if (file.type.startsWith("image/")) {
          // ── Image path: re-encode through <canvas> as JPEG ────────
          // This fixes iOS HEIC/HEIF photos not rendering on non-Apple
          // browsers and compresses oversized mobile photos so they
          // reliably fit within WebSocket message limits.
          const objURL = URL.createObjectURL(file);
          const img = new Image();
          img.onload = () => {
            URL.revokeObjectURL(objURL);
            try {
              const MAX_EDGE = 1600;
              let w = img.naturalWidth;
              let h = img.naturalHeight;

              // Only downscale if the image exceeds MAX_EDGE on either side.
              if (w > MAX_EDGE || h > MAX_EDGE) {
                if (w >= h) { h = Math.round(h * MAX_EDGE / w); w = MAX_EDGE; }
                else       { w = Math.round(w * MAX_EDGE / h); h = MAX_EDGE; }
              }

              const canvas = document.createElement("canvas");
              canvas.width  = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);

              const jpegURL = canvas.toDataURL("image/jpeg", 0.85);

              // Estimate byte-length from the base64 portion
              const b64 = jpegURL.split(",")[1] || "";
              const jpegSize = Math.round((b64.length * 3) / 4);

              // Strip the original extension and replace with .jpg
              const baseName = file.name.replace(/\.[^.]+$/, "") || "photo";

              stagedFile.file      = file;
              stagedFile.dataURL    = jpegURL;
              stagedFile.overrides  = {
                filename: baseName + ".jpg",
                mimeType: "image/jpeg",
                size:     jpegSize,
              };

              showFilePreviewBar(
                { name: baseName + ".jpg", size: jpegSize, type: "image/jpeg" },
                jpegURL,
              );
              btnAttach.classList.add("has-file");
              messageInput.focus();
            } catch (err) {
              console.warn("[Whisper] Canvas re-encode failed, falling back to raw file:", err);
              stageRawFile(file);
            }
          };
          img.onerror = () => {
            URL.revokeObjectURL(objURL);
            console.warn("[Whisper] Image load failed, falling back to raw file.");
            stageRawFile(file);
          };
          img.src = objURL;
        } else {
          // ── Non-image path: read bytes as-is (existing behaviour) ──
          stageRawFile(file);
        }
      });

      /** Read any file into a data-URL and stage it for sending. */
      function stageRawFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          stagedFile.file     = file;
          stagedFile.dataURL   = e.target.result;
          stagedFile.overrides = null;
          showFilePreviewBar(file, e.target.result);
          btnAttach.classList.add("has-file");
          messageInput.focus();
        };
        reader.readAsDataURL(file);
      }

      /** Show the preview bar with a thumbnail or icon */
      function showFilePreviewBar(file, dataURL) {
        const isImage = file.type.startsWith("image/");

        const thumbHTML = isImage
          ? `<img class="file-preview-thumb" src="${dataURL}" alt="preview" />`
          : `<div class="file-preview-icon">${fileIcon(file.type)}</div>`;

        filePreviewBar.innerHTML = `
          ${thumbHTML}
          <div class="file-preview-info">
            <div class="file-preview-name">${escapeHTML(file.name)}</div>
            <div class="file-preview-size">${formatBytes(file.size)}</div>
          </div>
          <button class="file-preview-dismiss" id="file-preview-dismiss" aria-label="Remove attachment">✕</button>
        `;
        filePreviewBar.classList.add("visible");

        document.getElementById("file-preview-dismiss").addEventListener("click", clearStagedFile);
      }

      /** Clear staged file and hide the preview bar */
      function clearStagedFile() {
        stagedFile.file      = null;
        stagedFile.dataURL    = null;
        stagedFile.overrides  = null;
        filePreviewBar.classList.remove("visible");
        filePreviewBar.innerHTML = "";
        btnAttach.classList.remove("has-file");
        fileInput.value = "";
      }

      // ── Send file ─────────────────────────────────────────────
      function handleSendFile() {
        const { file, dataURL, overrides } = stagedFile;
        if (!file || !dataURL) return;

        // After re-encoding images we store the effective filename/mime/size
        // in `overrides`; for non-images we fall back to the original File object.
        const payload = {
          filename: (overrides && overrides.filename) || file.name,
          mimeType: (overrides && overrides.mimeType) || file.type,
          size:     (overrides && overrides.size)     || file.size,
          dataURL,
        };

        // Render locally
        renderFileMessage(currentUser, payload, true);

        // Broadcast over WebSocket
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "file", ...payload }));
        }

        clearStagedFile();
      }

      // ── Receive file ──────────────────────────────────────────
      function handleReceiveFile(sender, payload) {
        renderFileMessage(sender, payload, false);
      }

      // ── Render: image or file card ────────────────────────────
      function renderFileMessage(sender, payload, isMe) {
        const { filename, mimeType, dataURL, size } = payload;
        const isImage = mimeType && mimeType.startsWith("image/");

        const msgDiv = document.createElement("div");
        msgDiv.className = `msg-wrapper ${isMe ? "sent" : "received"}`;

        let bubbleContent;
        if (isImage) {
          // Image bubble — click to open lightbox
          const imgId = `img-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          bubbleContent = `
            <div class="msg-author">${isMe ? "You" : escapeHTML(sender)}</div>
            <div class="msg-bubble is-media">
              <img
                class="msg-image"
                id="${imgId}"
                src="${dataURL}"
                alt="${escapeHTML(filename)}"
                title="${escapeHTML(filename)}"
              />
            </div>
            <div class="msg-time">${getTimeString()}</div>
          `;
          msgDiv.innerHTML = bubbleContent;
          msgDiv.querySelector(`#${imgId}`).addEventListener("click", () => openLightbox(dataURL));
        } else {
          // File card with download link
          const icon = fileIcon(mimeType);
          bubbleContent = `
            <div class="msg-author">${isMe ? "You" : escapeHTML(sender)}</div>
            <div class="msg-bubble is-file">
              <a
                class="msg-file-card"
                href="${dataURL}"
                download="${escapeHTML(filename)}"
                title="Download ${escapeHTML(filename)}"
              >
                <span class="msg-file-icon">${icon}</span>
                <div class="msg-file-details">
                  <div class="msg-file-name">${escapeHTML(filename)}</div>
                  <div class="msg-file-size">${formatBytes(size)}</div>
                </div>
                <span class="msg-file-dl">⬇️</span>
              </a>
            </div>
            <div class="msg-time">${getTimeString()}</div>
          `;
          msgDiv.innerHTML = bubbleContent;
        }

        chatMessages.appendChild(msgDiv);
        scrollToBottom();
      }

      // ── Lightbox ──────────────────────────────────────────────
      function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.add("visible");
      }
      function closeLightbox() {
        lightbox.classList.remove("visible");
        // Clear src after transition to free memory
        setTimeout(() => { lightboxImg.src = ""; }, 300);
      }
      lightbox.addEventListener("click", (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      lightboxClose.addEventListener("click", closeLightbox);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && lightbox.classList.contains("visible")) closeLightbox();
      });

      // ═══════════════════════════════════════════════════════════
      //  EVENT LISTENERS
      // ═══════════════════════════════════════════════════════════

      // Login
      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        currentUser = document.getElementById("username").value.trim();
        currentChannel = document.getElementById("channel").value.trim();
        currentPassword = document.getElementById("password").value;

        document.getElementById("display-channel").innerText = currentChannel;
        document.getElementById("display-user").innerText = `@${currentUser}`;

        try {
          await connectWebSocket();
        } catch (err) {
          alert(
            "Could not connect to server. Make sure the server is running (node server.js).",
          );
          return;
        }

        loginScreen.classList.add("hidden");
        setTimeout(() => {
          chatScreen.classList.remove("hidden");
          isChatActive = true;
          messageInput.focus();
          chatMessages.innerHTML = "";
          pendingTicks.clear(); // fresh room — drop any stale receipt handles
          spawnParticles();
          renderDateDivider();
          renderWelcomeCard(currentChannel, currentUser);
          addPresenceUser(currentUser, true);
          // Request notification permission on join (user gesture context)
          requestNotifPermission();
          // Re-apply saved background (chat-messages was cleared above)
          if (activeBgValue) applyBackground(activeBgValue);
        }, 400);
      });

      // Chat form submit — BUG-FIX: isSubmitting flag prevents double-send
      // if the user somehow triggers submit twice in rapid succession.
      chatForm.addEventListener("submit", function (e) {
        e.preventDefault();
        if (isSubmitting) return;
        isSubmitting = true;

        // Send staged file first (if any)
        if (stagedFile.file) {
          handleSendFile();
        }

        // Send text message if there's text in the input
        const text = messageInput.value.trim();
        if (text) {
          handleSendMessage(text);
        }

        isSubmitting = false;
      });

      // Leave
      function leaveChat() {
        isChatActive = false;
        isReconnecting = false;
        endCall(false); // hang up any in-progress call

        // Stop keep-alive and any pending reconnect attempt
        clearInterval(pingTimer);
        pingTimer = null;
        clearTimeout(pongTimeout);
        pongTimeout = null;
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        pendingTicks.clear();

        if (ws) {
          ws.onclose = null;
          ws.onerror = null;
          try {
            ws.close();
          } catch (_) {}
          ws = null;
        }

        chatScreen.classList.add("hidden");
        setTimeout(() => {
          loginScreen.classList.remove("hidden");
          loginForm.reset();
          onlineUsers.forEach((_, k) => removePresenceUser(k));
          onlineUsers.clear();
          presenceList.innerHTML = "";
          currentUser = currentChannel = currentPassword = "";
          reconnectDelay = 2000;
        }, 400);
      }
    </script>
  </body>
</html>
