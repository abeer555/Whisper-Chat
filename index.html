<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper Chat — Ephemeral rooms with voice, presence & live theming</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Ambient Background -->
    <div class="background-blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <!-- Hidden file input -->
    <input
      type="file"
      id="file-input"
      accept="image/*,application/pdf,text/*,application/msword,application/vnd.openxmlformats-officedocument.*,application/zip,application/x-zip-compressed"
      style="display:none"
    />

    <!-- VIEW 1: LOGIN CARD -->
    <div class="screen" id="login-screen">
      <div class="brand-header">
        <svg viewBox="0 0 24 24">
          <path
            d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"
          />
        </svg>
        <h1>Whisper Chat</h1>
        <p>Ephemeral rooms with voice, presence &amp; live theming</p>
        <span class="brand-tag">Solo build · WebSocket + WebRTC</span>
      </div>

      <form id="login-form">
        <div class="input-group">
          <input
            type="text"
            id="username"
            placeholder=" "
            required
            autocomplete="off"
            minlength="2"
            maxlength="20"
          />
          <label>Username</label>
        </div>

        <div class="input-group">
          <input
            type="text"
            id="channel"
            placeholder=" "
            required
            autocomplete="off"
          />
          <label>Channel ID</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" placeholder=" " required />
          <label>Password</label>
        </div>

        <button type="submit" class="btn-primary">Join Room</button>

        <div class="demo-row">
          <button type="button" class="btn-demo" id="btn-demo">
            ✨ Try a public demo room
          </button>
        </div>
      </form>
    </div>

    <!-- VIEW 2: FULL-SCREEN CHAT -->
    <div class="screen hidden" id="chat-screen">
      <header class="chat-header">
        <div class="chat-header-left">
          <div class="channel-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M16 4L14 20M10 4L8 20M5 8H21M3 16H19"
                stroke="white"
                stroke-width="2.5"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="chat-info">
            <h2>
              <span id="display-channel">general</span>
            </h2>
            <p id="display-user">Logged in as @user</p>
          </div>
        </div>
        <div class="header-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            title="Toggle dark mode"
          >
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
          </button>

          <!-- Background picker -->
          <div class="bg-picker-wrap">
            <button class="btn-icon" id="btn-bg-picker" title="Customise background">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.06-.92-.1-1.36-.24.25-.56.36-.9.36a1.5 1.5 0 0 1-1.5-1.5v-2a1.5 1.5 0 0 0-1.5-1.5h-2a1.5 1.5 0 0 1-1.5-1.5c0-.34.11-.66.36-.9C13.08 3.06 12.54 3 12 3zm-3.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm0 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4-6.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm4 2.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/></svg>
            </button>
            <div class="bg-picker-panel" id="bg-picker-panel">
              <div class="bg-picker-label">Chat Background</div>
              <div class="bg-swatch-grid" id="bg-swatch-grid"><!-- injected by JS --></div>
              <div class="bg-picker-divider"></div>
              <div class="bg-custom-row">
                <span class="bg-custom-label">Custom colour</span>
                <input type="color" class="bg-custom-input" id="bg-custom-input" value="#f1f5f2" title="Pick a custom background colour">
              </div>
            </div>
          </div>

          <button
            class="btn-icon call-btn-disabled"
            id="btn-call"
            title="Start voice call"
            onclick="initiateCall()"
          >
            <svg viewBox="0 0 24 24">
              <path
                d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"
              />
            </svg>
          </button>
          <button class="btn-icon" onclick="leaveChat()" title="Disconnect">
            <svg viewBox="0 0 24 24">
              <path
                d="M16 17v-3H9v-4h7V7l5 5-5 5M14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div class="presence-bar" id="presence-bar">
        <span class="presence-label">👥 Online:</span>
        <div id="presence-list">
          <!-- Presence entries injected here -->
        </div>
        <span class="presence-count" id="presence-count"></span>
      </div>

      <!-- Active call notification bar -->
      <div class="active-call-bar" id="active-call-bar">
        <span class="call-live-dot"></span>
        <span>Voice call with <strong id="call-peer-name"></strong></span>
        <span class="call-timer" id="call-timer">00:00</span>
        <button class="btn-mute" id="btn-mute" title="Toggle mute">
          🎤 Mute
        </button>
        <button
          class="btn-end-active"
          id="btn-end-active"
          title="End call"
          onclick="endCall()"
        >
          End call
        </button>
      </div>

      <!-- File pre-send preview bar -->
      <div class="file-preview-bar" id="file-preview-bar">
        <!-- Content injected by JS -->
      </div>

      <!-- Reply context bar (shown when user clicks ↩ on a message) -->
      <div class="reply-context-bar" id="reply-context-bar">
        <span class="reply-context-bar-icon">↩</span>
        <div class="reply-context-bar-body">
          <div class="reply-context-bar-author" id="reply-context-author"></div>
          <div class="reply-context-bar-text" id="reply-context-text"></div>
        </div>
        <button class="reply-context-bar-dismiss" id="reply-context-dismiss" title="Cancel reply" aria-label="Cancel reply">✕</button>
      </div>

      <main class="chat-main" id="chat-messages">
        <!-- Messages inject here -->
        <!-- Typing indicator (sticky bottom) -->
        <div class="typing-indicator-row" id="typing-indicator-row"></div>
      </main>

      <footer class="chat-footer">
        <div class="emoji-section" id="emoji-section">
          <button
            type="button"
            class="emoji-trigger"
            id="emoji-trigger"
            aria-label="Open emoji picker"
            aria-expanded="false"
          >
            😀
          </button>
          <div
            class="emoji-picker"
            id="emoji-picker"
            role="dialog"
            aria-label="Emoji picker"
          >
            <div class="emoji-search-wrap">
              <input
                type="text"
                class="emoji-search"
                id="emoji-search"
                placeholder="Search emojis…"
                autocomplete="off"
              />
            </div>
            <div class="emoji-tabs" id="emoji-tabs" role="tablist">
              <!-- Category tabs injected by JS -->
            </div>
            <div class="emoji-grid-wrap">
              <div class="emoji-section-label" id="emoji-category-label">
                Smileys &amp; People
              </div>
              <div class="emoji-grid" id="emoji-grid"></div>
            </div>
            <div
              class="emoji-recent-wrap"
              id="emoji-recent-wrap"
              style="display: none"
            >
              <div class="emoji-section-label">Recently used</div>
              <div class="emoji-recent-grid" id="emoji-recent-grid"></div>
            </div>
          </div>
        </div>

        <!-- Attach file button -->
        <button
          type="button"
          class="btn-attach"
          id="btn-attach"
          title="Attach file or photo"
          aria-label="Attach file or photo"
        >
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6h-1.5v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6H16.5z"/>
          </svg>
        </button>

        <form class="input-container" id="chat-form">
          <input
            type="text"
            id="message-input"
            placeholder="Type your message..."
            autocomplete="off"
            aria-label="Message"
          />
        </form>

        <button
          type="submit"
          form="chat-form"
          class="btn-send"
          title="Send Message"
        >
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>

        <div class="focus-indicator"></div>
      </footer>
    </div>

    <!-- Incoming / Outgoing Call Overlay -->
    <div class="call-overlay" id="call-overlay">
      <div class="call-card">
        <div class="call-avatar" id="call-avatar">📞</div>
        <div class="call-card-label" id="call-card-label">Incoming Call</div>
        <div class="call-card-name" id="call-card-name">@username</div>
        <div class="call-card-actions" id="call-card-actions">
          <!-- Buttons injected by JS depending on incoming vs outgoing -->
        </div>
      </div>
    </div>


    <!-- WebRTC audio output -->
    <audio id="remote-audio" autoplay playsinline></audio>

    <!-- Lightbox overlay for full-size image view -->
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightbox-close" aria-label="Close">✕</button>
      <img id="lightbox-img" src="" alt="Full size preview" />
    </div>
    <!-- Application Logic -->
    <script src="/js/utils.js"></script>
    <script src="/js/state.js"></script>
    <script src="/js/dom.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/render.js"></script>
    <script src="/js/reply.js"></script>
    <script src="/js/presence.js"></script>
    <script src="/js/emoji.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/files.js"></script>
    <script src="/js/background.js"></script>
    <script src="/js/notifications.js"></script>
    <script src="/js/calls.js"></script>
    <script src="/js/connection.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
